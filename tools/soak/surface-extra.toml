# The surface the `surface` query cannot enumerate (safety-plan W1.7), kept by hand.
# Each item says what reaches it (`covered_by`: a monkey source or QA scenario) or
# why the monkey cannot (`excluded`: the reason and the test that covers it instead).
# An item with neither is reported as UNCOVERED by tools/soak/surface.py.

[item."external file changes"]
kind = "outside world"
covered_by = "monkey `external` source (rewrite, append, truncate, CRLF, binary, create/delete trees, renames, chmod, symlinks and loops) and the churn thread"

[item."git from outside"]
kind = "outside world"
covered_by = "monkey `external` source (commit, switch, stash, stash pop, a conflicting merge and its abort, checkout of a file; one change in twelve between `review-checkpoint-mark` and `review-checkpoint`)"

[item."git working trees"]
kind = "outside world"
covered_by = "monkey `external` source (`git-worktree`: three trees beside the project, added on a branch or detached, locked, deleted under git) followed by `git-worktrees`; the pick lists them and the run never chooses one (it would leave the scratch project, as `project-open` would) -- qa scenario git-worktree-switch opens one"

[item."kill -9 and relaunch"]
kind = "process"
covered_by = "monkey `kill9` source with the data-loss oracle, half of them at a named durable-write boundary (the app's `crash-points` query), a dozen a run in the `crash` profile; crashes relaunch on the same profile"

[item."window resize and focus loss"]
kind = "window system"
covered_by = "monkey `window` source (within the window's size hints); qa scenario window-minimum"

[item."file drops from other applications"]
kind = "window system"
covered_by = "monkey `file` source through the control channel's `pointer drop` (X cannot synthesize a drop)"

[item."terminal programs"]
kind = "process"
covered_by = "monkey `terminal` source (floods, alternate screen, titles, a pager, Ctrl+C/Ctrl+D/Ctrl+Z)"

[item."terminal bells and notifications while another application has the focus"]
kind = "window system"
covered_by = "monkey `terminal` source (BEL, OSC 9 and OSC 777 -- markup, an over-long body, a loop -- printed after the focus left; the desktop notification goes to tools/qa/desktopbin/notify-send, never the session's daemon); qa scenario terminal-alert-unfocused checks what is posted. X only"

[item."plugin APIs"]
kind = "plugins"
covered_by = "qa scenarios plugin-* (flows_plugin_api.py); the monkey runs with the bundled plugins only"

[item."language servers answering out of order"]
kind = "outside world"
covered_by = "the monkey's `tooling` profile through tools/qa/plugins/qa-chaos-lsp (a server for `.qachaos` files answering late, twice, under the wrong id, malformed or with neither result nor error first; stale-version diagnostics, server requests), with the LspSettle oracle after a quarter of them; real clangd through plugins/cpp-lsp; WorkspaceLspClient's sequence tests and LspSessionFuzz"

[item."debug adapters"]
kind = "outside world"
covered_by = "the monkey's `tooling` profile (gdb through plugins/gdb-dap on the fixture's program: breakpoints, runs, steps, sessions; not under rr, which cannot record a debugger's ptrace); qa scenarios dbg-*"

[item."remote projects"]
kind = "remote"
covered_by = "the soak's `remote` job type (its own loopback sshd per run, tools/qa/remote_host.py, with link and server faults and the convergence oracle); tools/qa/remote.py in run-checks qa-remote"

[item."native file dialogs"]
kind = "window system"
excluded = "a portal nobody answers under Xvfb blocks the loop; the monkey never presses Open/Save As. Covered by qa scenario native-dialogs (a stand-in zenity)"

[item."IME composition"]
kind = "window system"
covered_by = "monkey `ime` source through the control channel's `compose` command (Xvfb has no input method): pre-edit readings, conversions, commits and cancels"

[item."clipboard set by other applications"]
kind = "window system"
covered_by = "monkey `external` source puts foreign text on the X CLIPBOARD (App.foreign_clipboard, tools/qa/x_clipboard.py); qa scenario edit-foreign-clipboard. X only; SDL's paste race: TD-2026-11-13-449"

[item."images on the clipboard"]
kind = "window system"
covered_by = "monkey `terminal` source pastes an image-only clipboard into a terminal (App.foreign_clipboard_image: a PNG, a large one, and bytes that are not one), in the `remote` job into a host's terminal (the upload); the `external` source leaves one for every other paste. qa scenario terminal-paste-image checks the stored file and the typed path. X only"

[item."another machine's open files on a remote host"]
kind = "remote"
covered_by = "the `remote` job's `remote:roam` (remote_host.LoopbackHost.leave_session: another client's session, with files the project lacks, unportable paths, too many, garbage, an oversized text, then a disconnect and a reconnect) and `remote:leave` (focus loss, which uploads this machine's); the offer's Open button and `remote-open-session` are pressed like any other. One machine, so what the other client would have written is planted in the server's store"

[item."a remote host short of disk"]
kind = "remote"
excluded = "the Host view's `low disk:` row needs a nearly full filesystem under the host's project (as \"disk full\"); RemoteHostActivityTests cover the threshold and the row"

[item."suspend/resume and display hotplug"]
kind = "window system"
excluded = "not reachable on Xvfb; TD-2026-11-08-435 item 4"

[item."disk full"]
kind = "outside world"
excluded = "needs a size-limited filesystem for the fixture (safety-plan W5); TD-2026-11-08-435 item 3"

# What the `surface` query DOES enumerate and the monkey leaves alone on purpose:
# `[exclude.<category>]`, item = why, and what covers it instead. An item
# nothing reached and nothing excludes is a gap (surface.py lists it as "not
# reached"); an exclusion naming an item the app no longer has is reported stale.
# Keybindings are named by their id.

[exclude.commands]
quit = "ends the run; qa scenarios restart-* and session-* quit and relaunch"
key = "a control-channel primitive the driver steers with (the Wayland backend's input)"
pointer = "a control-channel primitive the driver steers with (drops, the Wayland backend's input)"

[exclude.keybindings]
quit = "ends the run; qa scenarios restart-* quit through the command"
open-file = "opens a native file dialog nobody answers under Xvfb; qa scenario native-dialogs (a stand-in zenity)"
open-folder = "opens a native folder dialog; qa scenario native-dialogs"

[exclude.settings]
"control.enabled" = "turning it off ends the channel the monkey drives the app through; qa scenario settings-control"
"session.restore_on_launch" = "the kill -9 oracle relies on the restore; qa scenario session-restore-off"
"remote.ssh_command" = "says how a host is reached: a value of the monkey's choosing points the app elsewhere; tools/qa/remote.py"
"remote.server_command" = "as remote.ssh_command; tools/qa/remote.py"
"remote.server_install" = "as remote.ssh_command; tools/qa/remote.py"
"remote.server_socket_dir" = "as remote.ssh_command (the session's own server lives in one); tools/qa/remote.py"

[exclude.menuRows]
"File/Quit" = "ends the run"
"File/Open File…" = "native file dialog; qa scenario native-dialogs"
"File/Open Folder…" = "native folder dialog; qa scenario native-dialogs"
"File/Save As…" = "native file dialog; qa scenario native-dialogs"
"Remote/Open Folder on Host…" = "prompts for a host; the remote job opens its host through `remote-open`"
