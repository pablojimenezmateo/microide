# Build + validate microide.
#
# Triggers are event-driven only (push / pull_request / workflow_dispatch), per
# openspec/specs/ci-workflow-reliability/spec.md, which forbids cron schedules.
#
# Every job drives tools/run-checks.sh rather than open-coding cmake+ctest, so a
# failing CI run reproduces locally with the exact command in the log header, and
# so the two paths cannot drift. run-checks.sh tees full build+test output to
# $MICROIDE_LOG_DIR; each job uploads that log, which is what makes a red run
# actionable without a local repro guess.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same ref supersedes the in-flight run. main is excluded so
  # the record of what passed on the release branch is never cancelled away.
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MICROIDE_LOG_DIR: ${{ github.workspace }}/ci-logs
  # ccache needs this to cache PCH-using translation units; run-checks.sh exports
  # it too, but the SDL3 build below runs outside that script.
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache lld git \
            libpcre2-dev liblua5.4-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl-dev

      # Ubuntu 24.04 ships no SDL3 packages, so it is built from source. The
      # whole tree is cached on the tag pair: a hit makes the install step a
      # no-op rebuild plus a copy.
      - name: Cache SDL3 build
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: /tmp/microide-sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('scripts/ci/install-sdl3-linux.sh') }}

      - name: Install SDL3
        run: scripts/ci/install-sdl3-linux.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-tests-${{ runner.os }}-

      # This runs the architecture-invariant lint too: it is a registered test
      # (tests/ArchitectureInvariantsTests.cpp), not a separate tool.
      - name: Build and run tests
        run: tools/run-checks.sh tests

      # Allocation-counting assertions compile to nothing in the default `tests`
      # build (MICROIDE_PERF_HARNESS_BUILD is OFF there), so the "must not
      # allocate" contracts in the render/view-model/presentation hot paths are
      # unchecked unless this second pass runs.
      #
      # `if: !cancelled()` on this and the two validation steps below: they are
      # INDEPENDENT lanes that happen to share this job's build tree, and the
      # default fail-fast made the first red one hide the rest. That is what the
      # 2026-09-03 run cost — a flaky test here left "does the perf gate still
      # fail when it should" and "does the tree pass under a hardened libstdc++"
      # unanswered, so the red run said less than it could have. Each still fails
      # the job; they just all report.
      - name: Run allocation-gated tests
        if: ${{ !cancelled() }}
        run: tools/run-checks.sh perf-tests

      # Proves the perf gate can still FAIL. Everything else in the perf lane
      # checks the product; this checks the instrument, by running one scenario
      # clean (must pass) and again inflated 4x (must fail). A green perf run is
      # not evidence unless the gate producing it can be shown to go red — the
      # same argument as the architecture lint's positive-control fixtures.
      # Deliberately placed in this job: the step above already built the
      # microide-perf tree, so this reuses it and costs two short scenario runs
      # rather than a second LTO build.
      - name: Prove the perf gate is not vacuous
        if: ${{ !cancelled() }}
        run: tools/run-checks.sh perf-canary

      # Library-precondition UB (an inverted std::clamp range, an out-of-bounds
      # operator[]) is invisible to all three sanitizers — it is library UB, not
      # language UB — and _GLIBCXX_ASSERTIONS turns it into an abort at near
      # release speed. Its first run as a lane caught four merge divider clamps
      # under a test that had covered the failing sizes all along (2026-09-03).
      - name: Run the suite with hardened libstdc++
        if: ${{ !cancelled() }}
        run: tools/run-checks.sh hardened

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-tests
          path: ${{ env.MICROIDE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  # Second compiler, and the only lane that treats a warning as an error.
  #
  # Before this job, no CI lane compiled the production tree with clang: `tests`,
  # all three `sanitizers` presets and `perf-tests` use the default /usr/bin/c++
  # (GCC — the presets set no compiler), `coverage` builds only microide_tests, and
  # `fuzz-smoke` builds twelve fuzz targets that list explicit sources instead of
  # linking microide_core. src/app/main.cpp, microide_perf and the three bench
  # binaries were compiled by exactly one compiler, and a whole-tree clang break
  # has reached main before.
  #
  # It is also the only lane with MICROIDE_WARNINGS_AS_ERRORS=ON. That option
  # defaults to OFF and every preset pins it OFF, so the extra-warning ratchet in
  # CMakeLists.txt was documented but unenforced. Compile-only: GCC already runs
  # the tests.
  clang-build:
    name: clang-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache lld git clang \
            libpcre2-dev liblua5.4-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl-dev

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: /tmp/microide-sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('scripts/ci/install-sdl3-linux.sh') }}

      - name: Install SDL3
        run: scripts/ci/install-sdl3-linux.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-clang-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-clang-${{ runner.os }}-

      - name: Build the whole tree with clang
        run: tools/run-checks.sh clang-build

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-clang-build
          path: ${{ env.MICROIDE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache lld git \
            libpcre2-dev liblua5.4-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl-dev

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: /tmp/microide-sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('scripts/ci/install-sdl3-linux.sh') }}

      - name: Install SDL3
        run: scripts/ci/install-sdl3-linux.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.sanitizer }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.sanitizer }}-${{ runner.os }}-

      # run-checks.sh tsan already wraps ctest in `setarch -R` and exports the
      # suppression file, so TSAN needs no privileged sysctl here.
      - name: Run ${{ matrix.sanitizer }}
        run: tools/run-checks.sh ${{ matrix.sanitizer }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.sanitizer }}
          path: ${{ env.MICROIDE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache lld git clang \
            libpcre2-dev liblua5.4-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl-dev

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: /tmp/microide-sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('scripts/ci/install-sdl3-linux.sh') }}

      - name: Install SDL3
        run: scripts/ci/install-sdl3-linux.sh

      # The fuzz targets list explicit sources rather than linking microide_core,
      # so adding a dependency to a shared .cpp breaks their link -- and no
      # default build flow compiles them, so that break is SILENT. This job is
      # what makes it loud. Short per-target runs against the committed corpora;
      # this is a build-and-smoke gate, not a fuzzing campaign.
      - name: Build and smoke fuzz targets
        env:
          MICROIDE_FUZZ_SECONDS: 20
        run: tools/run-checks.sh fuzz

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-fuzz
          path: ${{ env.MICROIDE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache lld git \
            clang llvm \
            libpcre2-dev liblua5.4-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl-dev

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: /tmp/microide-sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('scripts/ci/install-sdl3-linux.sh') }}

      - name: Install SDL3
        run: scripts/ci/install-sdl3-linux.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-coverage-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-coverage-${{ runner.os }}-

      # Sanitizers and fuzzers cannot find a defect in code that never executes,
      # and the architecture lint's rules are structural — satisfiable by code
      # that would fault on its first real run. Coverage is the check that says
      # whether a line ran at all. Floors are per-area, because the tree measured
      # 74% overall while the merge render surface sat at 0%.
      - name: Line coverage with per-area floors
        run: tools/run-checks.sh coverage

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-coverage
          path: ${{ env.MICROIDE_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache lld git \
            libpcre2-dev liblua5.4-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libx11-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl-dev

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: /tmp/microide-sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('scripts/ci/install-sdl3-linux.sh') }}

      - name: Install SDL3
        run: scripts/ci/install-sdl3-linux.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-package-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-package-${{ runner.os }}-

      # The artifact users actually receive was never validated before: the
      # pipeline built, tested, signed and published a .deb that could not load
      # libSDL3.so.0 on any machine but the maintainer's, for twenty releases.
      # Building the package here and launching it under a clean-machine library
      # path is what makes that class of bug loud instead of silent.
      - name: Build the .deb
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target microide -j"$(nproc)"
          cd build && cpack -G DEB

      - name: Verify the package starts on a clean system
        run: scripts/ci/verify-deb-runtime.sh build/microide_*_amd64.deb

      # A real install on a stock image, which is the only check that also proves
      # the declared Depends: are actually satisfiable from the archive.
      - name: Install into a stock container and launch
        run: |
          deb="$(ls build/microide_*_amd64.deb)"
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -euxc '
            apt-get update -qq
            apt-get install -y --no-install-recommends ./'"$deb"'
            SDL_VIDEODRIVER=dummy microide --version
          '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: microide-deb
          path: build/microide_*_amd64.deb
          retention-days: 7

  perf-baseline-tag:
    name: perf-baseline-tag
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # check_perf_baseline_tag.sh diffs BASE...HEAD, so it needs both.
          fetch-depth: 0

      # Perf baselines are absolute timings recorded on one pinned reference
      # machine, so CI cannot re-measure them. What it CAN enforce is that a
      # baseline was moved deliberately: a changed baseline JSON requires an
      # explicit `perf-baseline:` line saying why.
      - name: Require a perf-baseline justification
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          commits="$(git log --format=%B "origin/${{ github.base_ref }}..HEAD")"
          tools/check_perf_baseline_tag.sh \
            "origin/${{ github.base_ref }}" HEAD "${PR_BODY}" "${commits}"
