name: perf-harness

on:
  # CI trigger policy: event-driven only (no periodic schedules).
  pull_request:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  perf-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config git xvfb \
            libpcre2-dev libcurl4-openssl-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libudev-dev
          ./scripts/ci/install-sdl3-linux.sh

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Run smoke subset
        run: xvfb-run -a ./build/microide-perf-make/microide/microide_perf --smoke --iterations=1

  perf-baseline-tag:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce perf-baseline tag
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base_ref="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          commit_messages="$(git log --format=%B "${base_ref}..HEAD")"
          ./tools/check_perf_baseline_tag.sh "${base_ref}" HEAD "${PR_BODY}" "${commit_messages}"

  perf-gate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - perf-runner-v1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Run full perf suite
        run: xvfb-run -a ./build/microide-perf-make/microide/microide_perf --iterations=10 --reference-runner=perf-runner-v1

  long-soak-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - perf-runner-v1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Run long soak scenario (manual)
        env:
          MICROIDE_PERF_LONG_SOAK_SECONDS: "3600"
        run: xvfb-run -a ./build/microide-perf-make/microide/microide_perf --scenarios=long_soak_8h --iterations=1 --reference-runner=perf-runner-v1
