name: perf-harness

on:
  # CI trigger policy: event-driven only (no periodic schedules).
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      capture_git_workstation_baselines:
        description: Capture git workstation baselines on perf-runner-v1 (reference evidence)
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  perf-smoke:
    runs-on: ubuntu-24.04
    # Advisory: shared GitHub-hosted runners cannot meet the perf budgets
    # reliably with --iterations=1. The hard gate is perf-gate on the
    # self-hosted perf-runner-v1 label.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config git xvfb \
            libpcre2-dev libcurl4-openssl-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libudev-dev
          ./scripts/ci/install-sdl3-linux.sh

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Run smoke subset
        run: xvfb-run -a ./build/microide-perf-make/microide/microide_perf --smoke --iterations=1 --require-fixtures

  perf-baseline-tag:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce perf-baseline tag
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base_ref="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          commit_messages="$(git log --format=%B "${base_ref}..HEAD")"
          ./tools/check_perf_baseline_tag.sh "${base_ref}" HEAD "${PR_BODY}" "${commit_messages}"

  perf-gate:
    if: >-
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.capture_git_workstation_baselines != 'true'))
    runs-on:
      - self-hosted
      - perf-runner-v1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare perf fixtures
        run: |
          bash tests/perf/generate_git_fixture.sh
          bash tests/perf/generate_git_workstation_fixtures.sh

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Run full perf suite
        run: xvfb-run -a ./build/microide-perf-make/microide/microide_perf --iterations=10 --reference-runner=perf-runner-v1 --require-fixtures

  perf-baseline-capture:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_git_workstation_baselines == 'true'
    runs-on:
      - self-hosted
      - perf-runner-v1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare perf fixtures
        run: |
          bash tests/perf/generate_git_fixture.sh
          bash tests/perf/generate_git_workstation_fixtures.sh

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Capture git workstation baselines
        run: |
          xvfb-run -a ./build/microide-perf-make/microide/microide_perf \
            --reference-runner=perf-runner-v1 \
            --require-fixtures \
            --iterations=10 \
            --update-baseline \
            --scenarios=git_sidebar_refresh_large_repo,git_sidebar_refresh_many_untracked,diff_open_1000_file_changes,diff_next_hunk_large_file,diff_stage_hunk_large_patch,diff_stage_selected_lines,merge_open_many_conflicts,merge_next_conflict_large_file,merge_accept_hunk_interleaved,merge_edit_result_then_scroll,commit_open_with_large_staged_set,external_change_refresh_open_diff,external_change_refresh_open_merge \
            --report-json=perf-git-workstation-baselines.json

      - name: Upload reference baselines
        uses: actions/upload-artifact@v4
        with:
          name: perf-git-workstation-baselines
          path: |
            tests/perf/baselines/git_sidebar_refresh_large_repo.json
            tests/perf/baselines/git_sidebar_refresh_many_untracked.json
            tests/perf/baselines/diff_open_1000_file_changes.json
            tests/perf/baselines/diff_next_hunk_large_file.json
            tests/perf/baselines/diff_stage_hunk_large_patch.json
            tests/perf/baselines/diff_stage_selected_lines.json
            tests/perf/baselines/merge_open_many_conflicts.json
            tests/perf/baselines/merge_next_conflict_large_file.json
            tests/perf/baselines/merge_accept_hunk_interleaved.json
            tests/perf/baselines/merge_edit_result_then_scroll.json
            tests/perf/baselines/commit_open_with_large_staged_set.json
            tests/perf/baselines/external_change_refresh_open_diff.json
            tests/perf/baselines/external_change_refresh_open_merge.json
            perf-git-workstation-baselines.json

  long-soak-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.capture_git_workstation_baselines != 'true'
    runs-on:
      - self-hosted
      - perf-runner-v1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset microide-perf

      - name: Build
        run: cmake --build build/microide-perf-make --target microide_perf -j8

      - name: Run long soak scenario (manual)
        env:
          MICROIDE_PERF_LONG_SOAK_SECONDS: "3600"
        run: xvfb-run -a ./build/microide-perf-make/microide/microide_perf --scenarios=long_soak_8h --iterations=1 --reference-runner=perf-runner-v1 --require-fixtures
