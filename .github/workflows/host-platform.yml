name: host-platform

on:
  # CI trigger policy: event-driven only (no periodic schedules).
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  host-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: microide-linux-x86_64
            package_script: ./scripts/ci/package-linux.sh
            dist_dir: dist/microide-linux
            shell: bash
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                cmake ninja-build pkg-config git patchelf \
                libpcre2-dev libcurl4-openssl-dev liblua5.4-dev \
                libfreetype-dev libharfbuzz-dev \
                libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
                libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
                libwayland-dev wayland-protocols \
                libegl1-mesa-dev libgl1-mesa-dev \
                libpulse-dev libasound2-dev libdbus-1-dev libudev-dev
              ./scripts/ci/install-sdl3-linux.sh
          - os: macos-15
            artifact: microide-macos-arm64
            package_script: ./scripts/ci/package-macos.sh
            dist_dir: dist/microide-macos
            shell: bash
            deps: |
              brew install cmake ninja pkg-config sdl3 sdl3_ttf pcre2 lua curl dylibbundler
          - os: windows-2022
            artifact: microide-windows-x86_64
            package_script: ./scripts/ci/package-windows.sh
            dist_dir: dist/microide-windows
            shell: msys2 {0}
            deps: |
              pacman -S --needed --noconfirm \
                mingw-w64-ucrt-x86_64-cmake \
                mingw-w64-ucrt-x86_64-ninja \
                mingw-w64-ucrt-x86_64-gcc \
                mingw-w64-ucrt-x86_64-sdl3 \
                mingw-w64-ucrt-x86_64-sdl3-ttf \
                mingw-w64-ucrt-x86_64-pcre2 \
                mingw-w64-ucrt-x86_64-lua \
                pkgconf \
                git

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Install Dependencies
        run: ${{ matrix.deps }}

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --target microide microide_tests

      - name: Host-Facing Regression Slice
        if: matrix.os != 'windows-2022'
        run: ./build/microide/microide_tests AppDirectories RuntimePaths FileOperationService Subprocess TerminalSession FileWatcher

      - name: Windows Full Test Suite
        if: matrix.os == 'windows-2022'
        run: ctest --test-dir build --output-on-failure -j1

      - name: Package Distribution
        run: ${{ matrix.package_script }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_dir }}
          if-no-files-found: error
          retention-days: 30

  sanitizer-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: microide-asan
            binary_dir: build/microide-asan
            soft_fail: false
          - preset: microide-ubsan
            binary_dir: build/microide-ubsan
            soft_fail: false
          - preset: microide-tsan
            binary_dir: build/microide-tsan
            soft_fail: false
    continue-on-error: ${{ matrix.soft_fail }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config git \
            libpcre2-dev libcurl4-openssl-dev liblua5.4-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libudev-dev
          ./scripts/ci/install-sdl3-linux.sh

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build ${{ matrix.binary_dir }} --target microide_tests -j8

      - name: Run Tests (${{ matrix.preset }})
        env:
          SDL_VIDEODRIVER: dummy
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan.supp:second_deadlock_stack=1
        run: ./${{ matrix.binary_dir }}/microide/microide_tests
