name: fuzz

on:
  # CI trigger policy: event-driven only (no periodic schedules).
  pull_request:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz-merge-candidate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config git \
            libpcre2-dev libcurl4-openssl-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libudev-dev
          ./scripts/ci/install-sdl3-linux.sh

      - name: Configure
        run: cmake -S . -B build/fuzz -DMICROIDE_FUZZ=ON -DMICROIDE_ENABLE_LUA_PLUGINS=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build Fuzzers
        run: cmake --build build/fuzz --target PersistedRecordReaderFuzz LegacyImporterFuzz SearchRegexFuzz GitBlameParserFuzz -j8

      - name: Run PersistedRecordReaderFuzz (60s)
        run: ./build/fuzz/microide/PersistedRecordReaderFuzz tests/fuzz/corpora/PersistedRecordReaderFuzz -max_total_time=60

      - name: Run LegacyImporterFuzz (60s)
        run: ./build/fuzz/microide/LegacyImporterFuzz tests/fuzz/corpora/LegacyImporterFuzz -max_total_time=60

      - name: Run SearchRegexFuzz (60s)
        run: ./build/fuzz/microide/SearchRegexFuzz tests/fuzz/corpora/SearchRegexFuzz -max_total_time=60

      - name: Run GitBlameParserFuzz (60s)
        run: ./build/fuzz/microide/GitBlameParserFuzz tests/fuzz/corpora/GitBlameParserFuzz -max_total_time=60

  fuzz-extended-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config git \
            libpcre2-dev libcurl4-openssl-dev \
            libfreetype-dev libharfbuzz-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libudev-dev
          ./scripts/ci/install-sdl3-linux.sh

      - name: Configure
        run: cmake -S . -B build/fuzz -DMICROIDE_FUZZ=ON -DMICROIDE_ENABLE_LUA_PLUGINS=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build Fuzzers
        run: cmake --build build/fuzz --target PersistedRecordReaderFuzz LegacyImporterFuzz SearchRegexFuzz GitBlameParserFuzz -j8

      - name: Run PersistedRecordReaderFuzz (extended manual)
        run: ./build/fuzz/microide/PersistedRecordReaderFuzz tests/fuzz/corpora/PersistedRecordReaderFuzz -max_total_time=900

      - name: Run LegacyImporterFuzz (extended manual)
        run: ./build/fuzz/microide/LegacyImporterFuzz tests/fuzz/corpora/LegacyImporterFuzz -max_total_time=900

      - name: Run SearchRegexFuzz (extended manual)
        run: ./build/fuzz/microide/SearchRegexFuzz tests/fuzz/corpora/SearchRegexFuzz -max_total_time=900

      - name: Run GitBlameParserFuzz (extended manual)
        run: ./build/fuzz/microide/GitBlameParserFuzz tests/fuzz/corpora/GitBlameParserFuzz -max_total_time=900
